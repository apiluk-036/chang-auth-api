# MySQL for development and for `npm test`.
#   npm run db:up        (or: docker compose up -d mysql)
# Creates chang_db (for the app) and chang_test (for tests only; tests wipe it).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chang_db
      MYSQL_USER: chang_app
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./test/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
