# Nginx + Let's Encrypt (certbot)
# 1. Point your domain's DNS (A record) at this server, open ports 80 and 443.
# 2. Replace api.example.com with your domain.
# 3. Copy to /etc/nginx/sites-available/chang-auth-api and symlink into sites-enabled.
# 4. Get a certificate:  sudo certbot --nginx -d api.example.com
# 5. sudo nginx -t && sudo systemctl reload nginx
#
# In .env for the Node app:  NODE_ENV=production  TRUST_PROXY=1  HOST=127.0.0.1

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Required: the app uses these for the real client IP (rate limit)
        # and to know the request came in over HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
