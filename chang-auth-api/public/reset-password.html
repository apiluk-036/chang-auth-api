<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <p class="subtitle">หลังตั้งรหัสใหม่ ทุกอุปกรณ์ที่เข้าสู่ระบบอยู่จะถูกออกจากระบบ</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <form id="resetForm" novalidate>
      <label for="password">รหัสผ่านใหม่</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <p class="hint">อย่างน้อย 8 ตัวอักษร</p>

      <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>

      <button id="submitBtn" type="submit">ตั้งรหัสผ่านใหม่</button>
    </form>

    <p class="switch"><a href="/forgot-password">ขอลิงก์ใหม่</a> · <a href="/login">เข้าสู่ระบบ</a></p>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
