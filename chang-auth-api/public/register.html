<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สร้างบัญชีใหม่</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <form id="registerForm" novalidate>
      <label for="fullName">ชื่อ-นามสกุล</label>
      <input id="fullName" name="fullName" type="text" autocomplete="name">

      <label for="email">อีเมล</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">รหัสผ่าน</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <p class="hint">อย่างน้อย 8 ตัวอักษร</p>

      <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>

      <button id="submitBtn" type="submit">สมัครสมาชิก</button>
    </form>

    <p class="switch">มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a></p>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
