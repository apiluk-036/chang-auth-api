<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลืมรหัสผ่าน</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>ลืมรหัสผ่าน</h1>
    <p class="subtitle">กรอกอีเมลของบัญชี เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <form id="forgotForm" novalidate>
      <label for="email">อีเมล</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <button id="submitBtn" type="submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
    </form>

    <p class="switch"><a href="/login">กลับไปหน้าเข้าสู่ระบบ</a></p>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
